<svg viewBox="0 0 460 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ecs-diagram-title">
  <title id="ecs-diagram-title">GameWare Interfacing System Diagram</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#2b303a" />
    </marker>

    <style>
      .gw-box {
        fill: #f0f5ff;
        stroke: #2b303a;
        stroke-width: 1.75;
      }
      .gw-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13.5px;
        font-weight: 500;
        fill: #1a1d24;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .gw-line {
        fill: none;
        stroke: #2b303a;
        stroke-width: 1.75;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
    </style>
  </defs>


  <line class="gw-line" x1="230" y1="478" x2="230" y2="322" marker-end="url(#arrow)" />
  <polyline class="gw-line" points="295,498 355,498 355,422" marker-end="url(#arrow)" />
  <polyline class="gw-line" points="355,378 355,302 295,302" marker-end="url(#arrow)" />
  <line class="gw-line" x1="230" y1="282" x2="230" y2="255" />
  <polyline class="gw-line" points="230,255 105,255 105,172" marker-end="url(#arrow)" />
  <polyline class="gw-line" points="230,255 355,255 355,222" marker-end="url(#arrow)" />
  <line class="gw-line" x1="355" y1="178" x2="355" y2="112" marker-end="url(#arrow)" />
  <polyline class="gw-line" points="355,72 355,62 230,62" />
  <polyline class="gw-line" points="105,128 105,62 230,62" />
  <line class="gw-line" x1="230" y1="62" x2="230" y2="46" marker-end="url(#arrow)" />


  <g transform="translate(230, 26)">
    <rect class="gw-box" x="-65" y="-20" width="130" height="40" rx="5" />
    <text class="gw-text" x="0" y="0">Scene</text>
  </g>

  <g transform="translate(355, 92)">
    <rect class="gw-box" x="-65" y="-20" width="130" height="40" rx="5" />
    <text class="gw-text" x="0" y="0">Pool Recipe</text>
  </g>

  <g transform="translate(105, 150)">
    <rect class="gw-box" x="-75" y="-22" width="150" height="44" rx="5" />
    <text class="gw-text" x="0" y="-8">Scene Component</text>
    <text class="gw-text" x="0" y="9">Space</text>
  </g>

  <g transform="translate(355, 200)">
    <rect class="gw-box" x="-75" y="-22" width="150" height="44" rx="5" />
    <text class="gw-text" x="0" y="-8">Recipe Component</text>
    <text class="gw-text" x="0" y="9">Space</text>
  </g>

  <g transform="translate(230, 302)">
    <rect class="gw-box" x="-65" y="-20" width="130" height="40" rx="5" />
    <text class="gw-text" x="0" y="0">GameWare</text>
  </g>

  <g transform="translate(355, 400)">
    <rect class="gw-box" x="-72" y="-22" width="144" height="44" rx="5" />
    <text class="gw-text" x="0" y="0">Custom GameWare</text>
  </g>

  <g transform="translate(230, 498)">
    <rect class="gw-box" x="-65" y="-20" width="130" height="40" rx="5" />
    <text class="gw-text" x="0" y="0">Component</text>
  </g>
